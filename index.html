<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H군의 데일리 체크리스트</title>
<meta name="theme-color" content="#F8F7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="H군 체크리스트">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F8F7F2; --panel:#FFFDF8; --line:#E7E7DC; --line2:#F0EFE6;
  --text:#283B30; --sub:#48584C; --muted:#6F7B71; --faint:#A1AA9F;
  --primary:#698970; --primary-soft:#EAF1E9; --navy:#394E40;
  --danger:#B95E53; --danger-soft:#FBF0EC; --ok:#648C68; --ok-soft:#EAF3E7;
  --ncmn:#738F82; --ncmn-bg:#EAF1E9; --ncmn-line:#D1E1D5;
  --cgn:#B78555; --cgn-bg:#F8EFE1; --cgn-line:#EBD7BE;
  --personal:#648C68; --personal-bg:#EDF3E8; --personal-line:#D6E5CF;
  --radius:18px; --shadow:0 1px 2px rgba(42,65,48,.04),0 6px 20px rgba(42,65,48,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:0 0 auto}

/* ---------- 헤더 ---------- */
.header{position:sticky;top:0;z-index:40;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brandIcon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#91AB91,#54765C);color:#FFFDF8;display:grid;place-items:center;box-shadow:0 4px 12px rgba(57,78,64,.18)}
.brandTitle{font-size:18px;font-weight:850;letter-spacing:-.4px}
.brandSub{font-size:12px;color:var(--muted);margin-top:2px}
.viewTabs{display:flex;gap:4px;background:#F0F1E9;border-radius:12px;padding:4px;margin-left:auto}
.viewTab{border:0;background:transparent;height:34px;padding:0 16px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.viewTab.active{background:#FFFDF8;color:var(--text);box-shadow:0 1px 3px rgba(42,65,48,.12)}
.tabBadge{min-width:18px;height:18px;border-radius:999px;background:var(--danger);color:#FFFDF8;font-size:10px;font-weight:850;display:grid;place-items:center;padding:0 5px}
.tabBadge[hidden]{display:none}
.headerRight{display:flex;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--muted);font-weight:650}
#syncStatus{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:#F0F1E9}
#syncStatus::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
#syncStatus.ok{color:var(--ok);background:var(--ok-soft)} #syncStatus.ok::before{background:var(--ok)}
#syncStatus.err{color:var(--danger);background:var(--danger-soft)} #syncStatus.err::before{background:var(--danger)}
.btn{border:1px solid var(--line);background:#FFFDF8;color:var(--sub);border-radius:10px;height:36px;padding:0 14px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:#F7F8F1}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#FFFDF8}
.btn.primary:hover{background:#4E7055}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}

/* ---------- 레이아웃 ---------- */
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;max-width:1560px;margin:0 auto;padding:20px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- 이번 주 할 일 패널 ---------- */
.sidebar{display:flex;flex-direction:column;position:sticky;top:88px;height:calc(100vh - 108px);overflow:hidden}
.sideTop{padding:20px 20px 16px;border-bottom:1px solid var(--line2)}
.panelHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panelTitleWrap{display:flex;gap:12px;align-items:center}
.panelIcon{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#FFFDF8;display:grid;place-items:center}
.sideTitle{font-size:19px;font-weight:850;letter-spacing:-.3px}
.todayDate{font-size:12px;color:var(--primary);font-weight:650;margin-top:3px}
.selectBox{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#FFFDF8;margin-top:14px;font-weight:650;outline:none}
.selectBox:focus{border-color:var(--primary)}
.progressBox{margin-top:12px;background:linear-gradient(180deg,#F2F6EF,#EAF1E9);border:1px solid #DCE8DA;border-radius:14px;padding:14px}
.pbTop{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.pbTop span:first-child{display:flex;align-items:center;gap:6px}
.pbPct{color:var(--primary)}
.pbText{font-size:12px;color:var(--primary);margin-top:6px}
.pbText b{color:var(--text)}
.bar{height:6px;background:#DDE5D8;border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .3s}
.searchBox{position:relative;margin-top:12px}
.searchBox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.searchBox input{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px 0 36px;outline:none;background:#FFFDF8}
.searchBox input:focus{border-color:var(--primary)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#F0F1E9;border-radius:12px;padding:4px;margin-top:12px}
.segBtn{border:0;background:transparent;height:34px;border-radius:9px;font-size:13px;font-weight:750;color:var(--muted)}
.segBtn.active{background:var(--navy);color:#FFFDF8}
.dragHint{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 20px;background:#F9FAF4;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted)}
.dragHint span:first-child{display:flex;align-items:center;gap:6px}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#E8EDE4;border-radius:6px;padding:3px 7px;color:var(--sub);white-space:nowrap}
.taskList{flex:1;overflow:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.groupTitle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--primary);margin:8px 4px 0}
.groupTitle.late{color:var(--danger)}
.groupTitle .cnt{color:var(--faint);font-weight:700}
.tcard{border:1px solid var(--line);border-radius:14px;background:#FFFDF8;padding:14px 14px 10px;transition:box-shadow .15s,border-color .15s;cursor:pointer}
.tcard:hover{border-color:#D1D9CC;box-shadow:0 4px 14px rgba(42,65,48,.06)}
.tTop{display:grid;grid-template-columns:12px 1fr 26px;gap:10px;align-items:start}
.grip{color:#CDD8CB;margin-top:4px}
.tTitle{font-size:14.5px;font-weight:800;line-height:1.45;word-break:keep-all}
.badge{display:inline-block;vertical-align:1px;margin-left:6px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--primary-soft);color:var(--primary);text-decoration:none}
.badge.late{background:var(--danger-soft);color:var(--danger)}
.badge.soon{background:#F0F1E9;color:var(--muted)}
.tDesc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;word-break:keep-all;white-space:pre-wrap}
.tCheck{width:26px;height:26px;border-radius:50%;border:2px solid #CDD8CB;background:#FFFDF8;display:grid;place-items:center;padding:0;color:#FFFDF8;transition:all .15s}
.tCheck:hover{border-color:var(--primary)}
.done .tCheck{background:var(--ok);border-color:var(--ok)}
.tcard.done{background:#FCFCF6}
.tcard.done .tTitle{text-decoration:line-through;color:var(--faint)}
.tFoot{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.durChip{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 4px 0 9px;border-radius:999px;background:#F0F1E9;color:var(--sub);font-size:12px;font-weight:700;cursor:pointer}
.durChip select{border:0;background:transparent;font-size:12px;font-weight:700;outline:none;cursor:pointer;max-width:86px}
.catChip{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:750;border:1px solid;white-space:nowrap}
.catChip.NCMN{background:var(--ncmn-bg);color:var(--ncmn);border-color:var(--ncmn-line)}
.catChip.CGN{background:var(--cgn-bg);color:var(--cgn);border-color:var(--cgn-line)}
.catChip.개인일정{background:var(--personal-bg);color:var(--personal);border-color:var(--personal-line)}
.tPeriod{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
.iconAct{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--faint);display:grid;place-items:center;flex:0 0 auto}
.iconAct:hover{background:#F0F1E9;color:var(--sub)}
.iconAct.del:hover{color:var(--danger);background:var(--danger-soft)}
.empty{border:1px dashed #DADFD2;border-radius:14px;padding:28px 12px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.6}

/* ---------- 오른쪽: 카테고리 + 달력 ---------- */
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.catCard{padding:16px 20px}
.catHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.catHeadLeft{display:flex;gap:12px;align-items:center}
.softIcon{width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.catTitle{font-weight:800;font-size:14.5px}
.catSub{font-size:12px;color:var(--muted);margin-top:2px}
.linkBtn{border:0;background:transparent;color:var(--primary);font-weight:750;font-size:13px;padding:6px}
.catChips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.catBtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:12px;background:#FFFDF8;font-size:13px;font-weight:750;color:var(--sub)}
.catBtn:hover{background:#F7F8F1}
.catBtn .ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#FFFDF8;background:#E0E6DD}
.catBtn:not(.active){color:var(--faint)}
.catBtn:not(.active) .ck svg{opacity:0}
.catBtn.active.NCMN .ck{background:var(--ncmn)}
.catBtn.active.CGN .ck{background:var(--cgn)}
.catBtn.active.개인일정 .ck{background:var(--personal)}
.catBtn .num{font-size:11px;background:#F0F1E9;border-radius:6px;padding:1px 7px;color:var(--muted)}
.calCard{overflow:hidden}
.calTop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:18px 20px}
.monthNav{display:flex;gap:8px;align-items:center}
.navGroup{display:flex;background:var(--navy);border-radius:10px;overflow:hidden}
.navGroup button{width:44px;height:40px;border:0;background:transparent;color:#FFFDF8;display:grid;place-items:center}
.navGroup button:hover{background:#48584C}
.todayBtn{height:40px;border:0;border-radius:10px;background:#6F7B71;color:#FFFDF8;padding:0 16px;font-weight:750}
.todayBtn:hover{background:#5C685C}
.monthTitle{text-align:center;font-size:24px;font-weight:650;letter-spacing:-.3px}
.calActions{display:flex;gap:8px;align-items:center}
.search{height:36px;width:180px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none;font-size:13px}
.search:focus{border-color:var(--primary)}
.calendarScroll{overflow:auto;padding:0 20px 20px}
.calendar{min-width:860px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#F7F8F1;border-bottom:1px solid var(--line)}
.weekdays div{text-align:center;padding:11px 0;font-size:13px;font-weight:800;color:var(--sub);border-right:1px solid var(--line2)}
.weekdays div:last-child{border-right:0}
.weekdays .sun{color:#B95E53}.weekdays .sat{color:#698970}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:7px;position:relative;background:#FFFDF8}
.week:last-child .day{border-bottom:0}
.day:nth-child(7){border-right:0}
.day.other{background:#FAFAF5}
.day.today{background:#F2F6EF}
.dateRow{height:24px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:8}
.dateNum{font-size:12.5px;font-weight:800;color:var(--sub);min-width:24px;height:24px;display:grid;place-items:center}
.day.sunCol .dateNum{color:#B95E53}.day.satCol .dateNum{color:#698970}
.day.other .dateNum{color:#C5CEC2}
.day.today .dateNum{background:var(--primary);color:#FFFDF8;border-radius:8px}
.addMini{border:0;background:transparent;color:var(--faint);font-size:16px;padding:0 4px;border-radius:6px;opacity:0;transition:opacity .15s}
.day:hover .addMini{opacity:1}
.addMini:hover{color:var(--primary);background:var(--primary-soft)}
.single,.range{height:24px;border-radius:6px;padding:0 8px;display:flex;align-items:center;font-size:11.5px;font-weight:750;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid transparent;color:var(--text)}
.single{margin-top:3px}
.single.NCMN,.range.NCMN{background:var(--ncmn-bg);border-color:var(--ncmn)}
.single.CGN,.range.CGN{background:var(--cgn-bg);border-color:var(--cgn)}
.single.개인일정,.range.개인일정{background:var(--personal-bg);border-color:var(--personal)}
.single.done,.range.done{opacity:.5;text-decoration:line-through}
.rangeLayer{position:absolute;left:0;right:0;top:35px;height:0;z-index:5;pointer-events:none}
.range{position:absolute;pointer-events:auto}
.barSpacer{width:100%;pointer-events:none}
.memoList{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.memoItem{font-size:11.5px;line-height:1.45;color:#5C685C;display:flex;gap:5px;align-items:flex-start;cursor:pointer;word-break:keep-all}
.memoItem:before{content:"•";color:var(--faint);flex:0 0 auto}
.memoItem.done{text-decoration:line-through;color:var(--faint)}
.memoAdd{margin-top:4px;border:0;background:transparent;color:var(--faint);font-size:11px;padding:0;opacity:0;transition:opacity .15s}
.day:hover .memoAdd{opacity:1}
.memoAdd:hover{color:var(--primary)}
@media(min-width:901px){
  .tcard[draggable="true"],.single[draggable="true"],.range[draggable="true"]{cursor:grab}
  .dragging{opacity:.45}
  .day.dropTarget{background:#EAF1E9 !important;box-shadow:inset 0 0 0 2px #A8BDA9}
}

/* ---------- 모달 ---------- */
.modalBackdrop{position:fixed;inset:0;background:rgba(42,65,48,.28);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modalBackdrop.show{display:flex}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#FFFDF8;border-radius:18px;box-shadow:0 24px 60px rgba(42,65,48,.2)}
.memoModal{width:min(460px,100%)}
.modalHead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line2)}
.modalTitle{font-size:17px;font-weight:850}
.closeBtn{border:0;background:transparent;font-size:22px;color:var(--faint);width:32px;height:32px;border-radius:8px}
.closeBtn:hover{background:#F0F1E9}
.modalBody{padding:18px 20px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.full{grid-column:1/-1}
.field[hidden]{display:none}
.field label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:13.5px;outline:none;background:#FFFDF8}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{min-height:80px;resize:vertical}
.modalFoot{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line2)}
.leftBtns,.rightBtns{display:flex;gap:8px}
.rPreview{grid-column:1/-1;font-size:12.5px;color:var(--primary);background:var(--primary-soft);border-radius:10px;padding:10px 12px;font-weight:750}

/* ---------- 반복 업무 ---------- */
body.view-routine .layout,body.view-routine .mobileAgenda{display:none !important}
body:not(.view-routine) .routineView{display:none}
.routineView{max-width:960px;margin:0 auto;padding:20px 24px}
.routinePanel{padding:22px}
.routineHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.routineStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px;background:#FFFDF8}
.statLabel{font-size:12px;color:var(--muted);font-weight:700}
.statNum{font-size:28px;font-weight:850;margin-top:4px;letter-spacing:-.5px}
.statNum.late{color:var(--danger)}
.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.progressRow .bar{flex:1;margin:0;background:#E8EDE4}
#rProgressText{font-size:12px;color:var(--muted);font-weight:750;white-space:nowrap}
.rFilters{display:flex;gap:6px;flex-wrap:wrap}
.rPill{border:1px solid var(--line);border-radius:999px;background:#FFFDF8;height:32px;padding:0 13px;font-size:12.5px;font-weight:750;color:var(--muted)}
.rPill.active{background:var(--navy);color:#FFFDF8;border-color:var(--navy)}
.rSection{margin-top:20px}
.rSectionTitle{font-size:13px;font-weight:800;color:var(--primary);margin:0 4px 8px;display:flex;align-items:center;gap:6px}
.rSectionTitle.late{color:var(--danger)}
.rSectionTitle.doneT{color:var(--muted)}
.rSectionTitle .cnt{font-weight:700;color:var(--faint)}
.rList{display:flex;flex-direction:column;gap:8px}
.rItem{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:13px 14px;background:#FFFDF8;cursor:pointer;transition:box-shadow .15s}
.rItem:hover{box-shadow:0 4px 14px rgba(42,65,48,.06)}
.rItem.late{background:#FEFAF7;border-color:#EDDAD5}
.rItem.NCMN{border-left-color:var(--ncmn)}
.rItem.CGN{border-left-color:var(--cgn)}
.rItem.개인일정{border-left-color:var(--personal)}
.rItem.done{background:#FCFCF6}
.rName{font-size:14.5px;font-weight:800;line-height:1.4;word-break:keep-all}
.rItem.done .rName{text-decoration:line-through;color:var(--faint)}
.rMeta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.rMemo{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;white-space:pre-wrap;word-break:keep-all}
.rRight{display:flex;align-items:center;gap:6px}
.due{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 10px;background:#F0F1E9;color:var(--muted);white-space:nowrap}
.due.today{background:var(--primary-soft);color:var(--primary)}
.due.late{background:var(--danger-soft);color:var(--danger)}
.due.done{background:var(--ok-soft);color:var(--ok)}
.skipBtn{border:1px solid var(--line);background:#FFFDF8;border-radius:8px;height:28px;padding:0 10px;font-size:12px;font-weight:700;color:var(--muted)}
.skipBtn:hover{background:#F7F8F1}
.rEmptySmall{font-size:12.5px;color:var(--faint);padding:8px 4px}
.suggestRow{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.suggestBtn{display:flex;justify-content:space-between;align-items:center;border:1px dashed #D2D8CC;background:#FFFDF8;border-radius:14px;padding:13px 14px;text-align:left;font-size:13.5px;font-weight:800;color:var(--sub)}
.suggestBtn span{font-size:12px;font-weight:700;color:var(--muted)}
.suggestBtn:hover{background:#F7F8F1;border-color:var(--primary)}

/* ---------- 모바일 일정 목록 ---------- */
.mobileAgenda{display:none}
.agendaFilters{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;padding-bottom:2px}
.agendaFilter{flex:0 0 auto;border:1px solid var(--line);background:#FFFDF8;border-radius:999px;height:32px;padding:0 12px;font-size:12.5px;font-weight:750;color:var(--muted)}
.agendaFilter.active{background:var(--navy);color:#FFFDF8;border-color:var(--navy)}
.agendaDay{border-top:1px solid var(--line2);padding:12px 0}
.agendaDay:first-child{border-top:0}
.agendaDate{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.agendaDateMain{font-size:14px;font-weight:850}
.agendaToday{font-size:10.5px;font-weight:800;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:3px 8px}
.agendaItems{display:flex;flex-direction:column;gap:6px}
.agendaEvent{border-radius:10px;padding:10px 12px;border-left:4px solid transparent;background:#FFFDF8}
.agendaEvent.NCMN{background:var(--ncmn-bg);border-color:var(--ncmn)}
.agendaEvent.CGN{background:var(--cgn-bg);border-color:var(--cgn)}
.agendaEvent.개인일정{background:var(--personal-bg);border-color:var(--personal)}
.agendaEvent.done{opacity:.5}
.agendaEventTitle{font-size:14px;font-weight:800;line-height:1.4}
.agendaEventMeta{font-size:11.5px;color:var(--muted);margin-top:3px}
.agendaMemo{font-size:13px;line-height:1.45;padding:9px 11px;border-radius:10px;background:#F7F8F1;border-left:3px solid #DADFD2}
.agendaMemo.done{text-decoration:line-through;color:var(--faint)}
.agendaEmpty{padding:22px 8px;text-align:center;color:var(--faint);font-size:12.5px}

/* ---------- 반응형 ---------- */
@media(max-width:1200px){
  .layout{grid-template-columns:340px minmax(0,1fr);gap:16px;padding:16px}
  .calTop{grid-template-columns:auto 1fr;}
  .monthTitle{text-align:left;font-size:21px}
  .calActions{grid-column:1/-1;flex-wrap:wrap}
  .calendar{min-width:640px}
  #authUser{display:none}
}
@media(max-width:900px){
  .header{padding:10px 12px;gap:10px}
  .brandIcon{width:36px;height:36px;border-radius:10px}
  .brandTitle{font-size:16px}
  .brandSub,#authUser,#syncStatus{display:none}
  .headerRight{margin-left:auto}
  .viewTabs{order:3;width:100%;margin-left:0}
  .viewTab{flex:1;justify-content:center;height:38px}
  .layout{display:block;padding:10px}
  .sidebar{position:static;height:auto;overflow:visible}
  .sideTop{padding:16px}
  .taskList{overflow:visible;padding:12px}
  .dragHint{display:none}
  .main{display:none}
  .mobileAgenda{display:block;padding:0 10px 14px}
  .mobileAgendaCard{padding:16px}
  .mobileAgendaTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mobileAgendaTitle{font-size:18px;font-weight:850}
  .mobileAgendaMonth{font-size:12px;color:var(--muted);margin-top:2px}
  .routineView{padding:10px}
  .routinePanel{padding:16px}
  .routineStats{gap:6px}
  .stat{padding:11px}
  .statNum{font-size:22px}
  .rItem{padding:12px 11px;gap:10px}
  .rRight{flex-direction:column;align-items:flex-end;gap:5px}
  .formGrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">

      <div id="taskList" class="taskList"></div>
    </aside>

    <main class="main">
      <section class="card catCard">
        <div class="catHead">
          <div class="catHeadLeft">

            <div>
              <div id="catCount" class="catTitle">카테고리</div>
              <div class="catSub">선택한 카테고리의 일정만 달력에 표시됩니다</div>
            </div>
          </div>
          <button id="catAllBtn" class="linkBtn">전체 해제</button>
        </div>
        <div id="catFilters" class="catChips">
          <button class="catBtn active NCMN" data-cat="NCMN"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>NCMN<span class="num">0</span></button>
          <button class="catBtn active CGN" data-cat="CGN"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>CGN<span class="num">0</span></button>
          <button class="catBtn active 개인일정" data-cat="개인일정"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>개인일정<span class="num">0</span></button>
        </div>
      </section>

      <section class="card calCard">
        <div class="calTop">
          <div class="monthNav">
            <div class="navGroup">
              <button id="prevBtn" aria-label="이전 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
              <button id="nextBtn" aria-label="다음 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
            <button id="todayBtn" class="todayBtn">오늘</button>
          </div>
          <div id="monthTitle" class="monthTitle"></div>
          <div class="calActions">
            <input id="search" class="search" placeholder="일정 검색">
            <button id="backupBtn" class="btn">백업</button>
            <label class="btn">복원<input id="restoreInput" type="file" accept="application/json" hidden></label>
            <button id="newBtn" class="btn primary">+ 일정 추가</button>
          </div>
        </div>
        <div class="calendarScroll">
          <div class="calendar">
            <div class="weekdays">
              <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
            </div>
            <div id="calendarBody"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="mobileAgenda" class="mobileAgenda">
    <div class="card mobileAgendaCard">
      <div class="mobileAgendaTop">
        <div>
          <div class="mobileAgendaTitle">이번 달 일정</div>
          <div id="mobileAgendaMonth" class="mobileAgendaMonth"></div>

      </div>
      <div id="mobileAgendaList"></div>

  </div>

        <div class="panelTitleWrap">
          <div class="panelIcon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>

        <button class="rPill active" data-r="전체">전체</button>
        <button class="rPill" data-r="NCMN">NCMN</button>
        <button class="rPill" data-r="CGN">CGN</button>
        <button class="rPill" data-r="개인일정">개인</button>
      </div>
      <div id="routineBody"></div>
    </div>
  </section>
</div>

<div id="modalBackdrop" class="modalBackdrop">

    </div>

  </div>
</div>

<div id="memoBackdrop" class="modalBackdrop">
  <div class="modal memoModal">

</div>

<!-- 업무 추가/수정 -->
<div id="routineBackdrop" class="modalBackdrop">
  <div class="modal">
    <div class="modalHead">
      <div id="routineModalTitle" class="modalTitle">업무 추가</div>
      <button id="rClose" class="closeBtn">×</button>
    </div>
    <div class="modalBody">
      <div class="formGrid">
        <div class="field full"><label>업무명</label><input id="rTitle" placeholder="예: 월요일분 운행표 완성"></div>

    </div>
  </div>
</div>

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app), provider=new GoogleAuthProvider();

/* ===================== 공통 ===================== */
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const WD=['일','월','화','수','목','금','토'];

const dOf=ds=>new Date(ds+'T00:00:00');
const shortDate=ds=>{const d=dOf(ds);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};

function dateDiffDays(a,b){return Math.round((dOf(b)-dOf(a))/86400000)}
function addDays(ds,n){const d=dOf(ds);d.setDate(d.getDate()+n);return ymd(d)}
const IC={

let user=null, events=[], memos=[], routines=[], unsub=null, memoUnsub=null, routineUnsub=null;
let editing=null, memoEditing=null, memoDate=null, routineEditing=null, draggingEventId=null;
let sideFilter='전체', taskTab='today', agendaFilter='전체', routineFilter='전체';
let catSet=new Set(CATS);
let current=new Date(); current=new Date(current.getFullYear(),current.getMonth(),1);

function setSync(t,state=''){ const e=$('#syncStatus'); e.textContent=t; e.className='sync '+state; }
function visible(e){ const q=$('#search').value.trim().toLowerCase(); return catSet.has(e.cat)&&(!q||`${e.title} ${e.memo||''}`.toLowerCase().includes(q)); }
function userCol(){ return collection(db,'users',user.uid,'hjm_events'); }
function memoCol(){ return collection(db,'users',user.uid,'hjm_memos'); }
function routineCol(){ return collection(db,'users',user.uid,'hjm_routines'); }
function requireLogin(){ if(user)return true; alert('먼저 Google 로그인을 해주세요.'); return false; }

/* ===================== 일정 저장 ===================== */
async function saveEvent(e){ if(!requireLogin())return; setSync('저장 중...'); try{await setDoc(doc(db,'users',user.uid,'hjm_events',e.id),e);setSync('동기화됨','ok')}catch(err){console.error(err);setSync('저장 오류','err');alert('저장하지 못했습니다.')} }
async function removeEvent(id){ if(!requireLogin())return; try{await deleteDoc(doc(db,'users',user.uid,'hjm_events',id))}catch(err){console.error(err);alert('삭제하지 못했습니다.')} }
async function moveEventToDate(id,target){
  const e=events.find(x=>x.id===id); if(!e)return;
  const dur=Math.max(0,dateDiffDays(e.start,e.end));
  await saveEvent({...e,start:target,end:addDays(target,dur)});
}
async function toggleDone(id){ const e=events.find(x=>x.id===id); if(e) await saveEvent({...e,done:!e.done}); }

function durOptions(v){
  const list=[...DURS]; if(v&&!list.includes(v))list.push(v);
  return `<option value="">소요시간</option>`+list.map(d=>`<option${d===v?' selected':''}>${esc(d)}</option>`).join('');
}

function openModal(date=null,id=null){
  if(!requireLogin())return;
  editing=id;
  const e=id?events.find(x=>x.id===id):null;
  $('#modalTitle').textContent=e?'일정 수정':'일정 추가';
  $('#titleInput').value=e?.title||'';
  $('#startInput').value=e?.start||date||ymd(new Date());
  $('#endInput').value=e?.end||date||ymd(new Date());
  $('#catInput').value=e?.cat||(sideFilter!=='전체'?sideFilter:'NCMN');
  $('#durInput').innerHTML=durOptions(e?.duration||'');
  $('#doneInput').value=String(!!e?.done);
  $('#memoInput').value=e?.memo||'';
  $('#deleteBtn').style.display=e?'':'none';
  $('#modalBackdrop').classList.add('show');
  setTimeout(()=>$('#titleInput').focus(),50);
}
function closeModal(){ $('#modalBackdrop').classList.remove('show'); editing=null; }

async function removeMemo(id){ if(!requireLogin())return; try{await deleteDoc(doc(db,'users',user.uid,'hjm_memos',id))}catch(err){console.error(err);alert('메모를 삭제하지 못했습니다.')} }

/* ===================== 드래그 ===================== */
function makeDraggable(el,id){
  if(!isDesktop())return;
  el.draggable=true;
  el.addEventListener('dragstart',ev=>{
    draggingEventId=id; el.classList.add('dragging');
    try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',id)}catch(_){}
  });
  el.addEventListener('dragend',()=>{
    draggingEventId=null; el.classList.remove('dragging');
    document.querySelectorAll('.day.dropTarget').forEach(x=>x.classList.remove('dropTarget'));
  });
}

/* ===================== 이번 주 할 일 패널 ===================== */
function dueBadge(e,today){
  if(e.done)return '';
  if(e.end<today)return `<span class="badge late">${dateDiffDays(e.end,today)}일 지남</span>`;
  if(e.start<=today)return `<span class="badge">${e.start!==e.end?'진행 중':'오늘'}</span>`;
  const n=dateDiffDays(today,e.start);
  return `<span class="badge soon">${n===1?'내일':'D-'+n}</span>`;
}
function taskCard(e,today){
  const el=document.createElement('div');
  el.className='tcard'+(e.done?' done':'');
  const period=e.start===e.end?shortDate(e.start):`${shortDate(e.start)} ~ ${shortDate(e.end)}`;
  el.innerHTML=`<div class="tTop"><span class="grip">${IC.grip}</span><div><div class="tTitle">${esc(e.title)}${dueBadge(e,today)}</div>${e.memo?`<div class="tDesc">${esc(e.memo)}</div>`:''}</div><button class="tCheck" aria-label="완료 체크">${e.done?IC.check:''}</button></div>`+
    `<div class="tFoot"><label class="durChip" title="소요시간">${IC.clock}<select aria-label="소요시간">${durOptions(e.duration||'')}</select></label><span class="catChip ${esc(e.cat)}">${esc(catName(e.cat))}</span><span class="tPeriod">${period}</span><span class="spacer"></span><button class="iconAct edit" title="수정">${IC.edit}</button><button class="iconAct del" title="삭제">${IC.trash}</button></div>`;
  el.querySelector('.tCheck').onclick=ev=>{ev.stopPropagation();toggleDone(e.id)};
  const dc=el.querySelector('.durChip'); dc.onclick=ev=>ev.stopPropagation();
  dc.querySelector('select').onchange=ev=>saveEvent({...e,duration:ev.target.value});
  el.querySelector('.edit').onclick=ev=>{ev.stopPropagation();openModal(null,e.id)};
  el.querySelector('.del').onclick=async ev=>{ev.stopPropagation();if(confirm(`'${e.title}' 일정을 삭제할까요?`))await removeEvent(e.id)};
  el.onclick=()=>openModal(null,e.id);
  makeDraggable(el,e.id);
  return el;
}
function renderTasks(){
  const now=new Date(), today=ymd(now), mon=mondayOf(now), sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const ws=ymd(mon), we=ymd(sun);
  $('#todayDate').textContent=`${mon.getMonth()+1}월 ${mon.getDate()}일(월) ~ ${sun.getMonth()+1}월 ${sun.getDate()}일(일)`;

  const byCat=events.filter(e=>sideFilter==='전체'||e.cat===sideFilter);
  const todayAll=byCat.filter(e=>e.start<=today&&e.end>=today);
  const doneN=todayAll.filter(e=>e.done).length, pct=todayAll.length?Math.round(doneN/todayAll.length*100):0;
  $('#todayPct').textContent=pct+'%';
  $('#todayBar').style.width=pct+'%';
  $('#todayText').innerHTML=!user?'로그인하면 오늘 진행률이 표시돼요':todayAll.length?`오늘 할 일 <b>${todayAll.length-doneN}개</b> 남음 / 총 ${todayAll.length}개`:'오늘 등록된 할 일이 없어요';

  const q=$('#taskSearch').value.trim().toLowerCase();
  const base=byCat.filter(e=>!q||`${e.title} ${e.memo||''}`.toLowerCase().includes(q));
  const lists={
    today:base.filter(e=>e.start<=today&&e.end>=today),
    open:base.filter(e=>!e.done&&e.start<=we),
    week:base.filter(e=>e.start<=we&&e.end>=ws)
  };
  $('#cntToday').textContent=lists.today.length;
  $('#cntOpen').textContent=lists.open.length;
  $('#cntWeek').textContent=lists.week.length;

  const box=$('#taskList'); box.innerHTML='';
  if(!user){box.innerHTML='<div class="empty">Google 로그인 후<br>할 일이 표시됩니다.</div>';return}

  const sortFn=(a,b)=>Number(!!a.done)-Number(!!b.done)||a.start.localeCompare(b.start)||a.title.localeCompare(b.title);
  const groups=[];
  if(taskTab==='today'){
    groups.push({title:'오늘의 할 일',items:lists.today.sort(sortFn)});
  }else if(taskTab==='open'){
    groups.push({title:'밀린 할 일',cls:'late',items:lists.open.filter(e=>e.end<today).sort(sortFn)});
    groups.push({title:'이번 주 남은 할 일',items:lists.open.filter(e=>e.end>=today).sort(sortFn)});
  }else{
    for(let i=0;i<7;i++){
      const d=new Date(mon); d.setDate(mon.getDate()+i); const ds=ymd(d);
      const items=lists.week.filter(e=>(e.start<ws?ws:e.start)===ds).sort(sortFn);
      groups.push({title:`${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})${ds===today?' · 오늘':''}`,cls:ds<today?'past':'',items});
    }
  }
  if(!groups.some(g=>g.items.length)){
    const msg=q?'검색 결과가 없어요.':{today:'오늘 할 일이 없어요.',open:'미완료 할 일이 없어요.<br>잘 하고 계세요!',week:'이번 주 할 일이 없어요.'}[taskTab];
    box.innerHTML=`<div class="empty">${msg}</div>`;return;
  }
  groups.forEach(g=>{
    if(!g.items.length)return;
    const t=document.createElement('div'); t.className='groupTitle '+(g.cls||'');
    t.innerHTML=`${esc(g.title)} <span class="cnt">${g.items.length}</span>`;
    box.appendChild(t);
    g.items.forEach(e=>box.appendChild(taskCard(e,today)));
  });
}

/* ===================== 카테고리 칩 ===================== */
function renderCatChips(){
  const y=current.getFullYear(), m=current.getMonth(), ms=ymd(new Date(y,m,1)), me=ymd(new Date(y,m+1,0));
  document.querySelectorAll('#catFilters .catBtn').forEach(b=>{
    const c=b.dataset.cat;
    b.classList.toggle('active',catSet.has(c));
    b.querySelector('.num').textContent=events.filter(e=>e.cat===c&&e.start<=me&&e.end>=ms).length;
  });
  $('#catCount').textContent=`카테고리 (${catSet.size}/${CATS.length} 선택)`;
  $('#catAllBtn').textContent=catSet.size===CATS.length?'전체 해제':'전체 선택';
}

/* ===================== 모바일 일정 목록 ===================== */
function renderMobileAgenda(){
  const box=$('#mobileAgendaList'); if(!box)return;
  const year=current.getFullYear(), month=current.getMonth();
  $('#mobileAgendaMonth').textContent=`${year}년 ${month+1}월`;
  const last=new Date(year,month+1,0), today=ymd(new Date());
  let any=false; box.innerHTML='';
  for(let day=1;day<=last.getDate();day++){
    const d=new Date(year,month,day), ds=ymd(d);
    const evs=events.filter(e=>e.start<=ds&&e.end>=ds&&(agendaFilter==='전체'||e.cat===agendaFilter));
    const ms=memos.filter(m=>m.date===ds);
    if(!evs.length&&!ms.length)continue;
    any=true;
    const section=document.createElement('div'); section.className='agendaDay';
    section.innerHTML=`<div class="agendaDate"><div class="agendaDateMain">${d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'})}</div>${ds===today?'<span class="agendaToday">오늘</span>':''}</div>`;
    const items=document.createElement('div'); items.className='agendaItems';
    evs.sort((a,b)=>Number(!!a.done)-Number(!!b.done)||a.title.localeCompare(b.title)).forEach(e=>{
      const row=document.createElement('div'); row.className=`agendaEvent ${e.cat}${e.done?' done':''}`;
      row.innerHTML=`<div class="agendaEventTitle">${e.done?'✓ ':''}${esc(e.title)}</div><div class="agendaEventMeta">${esc(catName(e.cat))}${e.start!==e.end?` · ${shortDate(e.start)} ~ ${shortDate(e.end)}`:''}${e.duration?' · '+esc(e.duration):''}${e.memo?' · '+esc(e.memo):''}</div>`;
      row.onclick=()=>openModal(null,e.id); items.appendChild(row);
    });
    ms.sort((a,b)=>Number(!!a.done)-Number(!!b.done)||a.createdAt-b.createdAt).forEach(m=>{
      const row=document.createElement('div'); row.className='agendaMemo'+(m.done?' done':'');
      row.textContent='메모 · '+m.text; row.onclick=()=>openMemo(ds,m.id); items.appendChild(row);
    });
    section.appendChild(items); box.appendChild(section);
  }
  if(!any)box.innerHTML='<div class="agendaEmpty">이번 달에 등록된 일정이나 메모가 없습니다.</div>';
}

/* ===================== 월간 달력 ===================== */
function renderCalendar(){
  $('#monthTitle').textContent=`${current.getFullYear()}년 ${current.getMonth()+1}월`;
  const root=$('#calendarBody'); root.innerHTML='';
  const first=new Date(current.getFullYear(),current.getMonth(),1), start=new Date(first); start.setDate(1-first.getDay());
  const todayStr=ymd(new Date());

  for(let w=0;w<6;w++){
    const wsD=new Date(start); wsD.setDate(start.getDate()+w*7);
    const weD=new Date(wsD); weD.setDate(wsD.getDate()+6);
    const ws=ymd(wsD), we=ymd(weD);
    const ranges=events.filter(e=>e.start!==e.end&&e.start<=we&&e.end>=ws&&visible(e))
      .sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:a.end.localeCompare(b.end));
    const laneEnd=[], infos=[];
    ranges.forEach(e=>{
      const s=e.start<ws?ws:e.start, en=e.end>we?we:e.end;
      let lane=laneEnd.findIndex(v=>v<s); if(lane<0)lane=laneEnd.length; laneEnd[lane]=en;
      infos.push({e,s,en,lane});
    });
    const barSpace=laneEnd.length?laneEnd.length*27+4:0;

    const week=document.createElement('div'); week.className='week';
    for(let d=0;d<7;d++){
      const dt=new Date(wsD); dt.setDate(wsD.getDate()+d); const ds=ymd(dt);
      const cell=document.createElement('div');
      cell.className='day'+(dt.getMonth()!==current.getMonth()?' other':'')+(ds===todayStr?' today':'')+(d===0?' sunCol':d===6?' satCol':'');
      if(isDesktop()){
        cell.addEventListener('dragover',ev=>{if(!draggingEventId)return;ev.preventDefault();try{ev.dataTransfer.dropEffect='move'}catch(_){}cell.classList.add('dropTarget')});
        cell.addEventListener('dragleave',ev=>{if(!cell.contains(ev.relatedTarget))cell.classList.remove('dropTarget')});
        cell.addEventListener('drop',async ev=>{
          ev.preventDefault(); cell.classList.remove('dropTarget');
          const id=draggingEventId||(()=>{try{return ev.dataTransfer.getData('text/plain')}catch(_){return ''}})();
          draggingEventId=null; if(id)await moveEventToDate(id,ds);
        });
      }
      cell.innerHTML=`<div class="dateRow"><div class="dateNum">${dt.getDate()}</div><button class="addMini" title="일정 추가">＋</button></div>${barSpace?`<div class="barSpacer" style="height:${barSpace}px"></div>`:''}`;
      cell.querySelector('.addMini').onclick=()=>openModal(ds);
      events.filter(e=>e.start===e.end&&e.start===ds&&visible(e)).sort((a,b)=>a.title.localeCompare(b.title)).forEach(e=>{
        const it=document.createElement('div'); it.className=`single ${e.cat}${e.done?' done':''}`;
        it.textContent=(e.done?'✓ ':'')+e.title; it.title=e.title;
        makeDraggable(it,e.id);
        it.onclick=()=>openModal(null,e.id); cell.appendChild(it);
      });
      const dayMemos=memos.filter(m=>m.date===ds).sort((a,b)=>Number(!!a.done)-Number(!!b.done)||a.createdAt-b.createdAt);
      if(dayMemos.length){
        const ml=document.createElement('div'); ml.className='memoList';
        dayMemos.forEach(m=>{const mi=document.createElement('div');mi.className='memoItem'+(m.done?' done':'');mi.textContent=m.text;mi.onclick=()=>openMemo(ds,m.id);ml.appendChild(mi)});
        cell.appendChild(ml);
      }
      const ma=document.createElement('button'); ma.className='memoAdd'; ma.textContent='+ 메모'; ma.onclick=()=>openMemo(ds); cell.appendChild(ma);
      week.appendChild(cell);
    }
    if(infos.length){
      const layer=document.createElement('div'); layer.className='rangeLayer';
      infos.forEach(({e,s,en,lane})=>{
        const c1=dOf(s).getDay(), c2=dOf(en).getDay();
        const bar=document.createElement('div'); bar.className=`range ${e.cat}${e.done?' done':''}`;
        bar.style.left=`calc(${c1/7*100}% + 5px)`; bar.style.width=`calc(${(c2-c1+1)/7*100}% - 10px)`; bar.style.top=`${lane*27}px`;
        bar.textContent=(e.done?'✓ ':'')+e.title; bar.title=e.title;
        makeDraggable(bar,e.id);
        bar.onclick=ev=>{ev.stopPropagation();openModal(null,e.id)}; layer.appendChild(bar);
      });
      week.appendChild(layer);
    }
    root.appendChild(week);
  }
  renderCatChips();
  renderTasks();
  renderMobileAgenda();
}

}
async function removeRoutine(id){
  if(!requireLogin())return false;
  try{await deleteDoc(doc(db,'users',user.uid,'hjm_routines',id));return true}
  catch(err){console.error(err);alert('업무를 삭제하지 못했습니다.');return false}
}
async function toggleRoutine(id){
  const r=routines.find(x=>x.id===id);if(!r)return;
  await saveRoutine({...r,taskDone:!r.taskDone,completedAt:!r.taskDone?ymd(new Date()):null});
}
function routineRow(r){
  const done=!!r.taskDone, overdue=!done&&r.due&&r.due<ymd(new Date());
  const el=document.createElement('div');
  el.className=`rItem ${done?'done':overdue?'late':''} ${r.cat||'NCMN'}`;
  const meta=[catName(r.cat||'NCMN')];
  if(r.due)meta.push(`${shortDate(r.due)} 마감`);
  if(done&&r.completedAt)meta.push(`${shortDate(r.completedAt)} 완료`);
  const chip=done?'<span class="due done">완료</span>':overdue?'<span class="due late">기한 지남</span>':r.due?'<span class="due">진행 중</span>':'';
  el.innerHTML=`<button class="tCheck" aria-label="${done?'완료 취소':'완료 체크'}">${done?IC.check:''}</button><div><div class="rName">${esc(r.title)}</div><div class="rMeta">${esc(meta.join(' · '))}</div>${r.memo?`<div class="rMemo">${esc(r.memo)}</div>`:''}</div><div class="rRight">${chip}</div>`;
  el.querySelector('.tCheck').onclick=ev=>{ev.stopPropagation();toggleRoutine(r.id)};
  el.onclick=()=>openRoutine(r.id);
  return el;
}
function renderRoutines(){

  $('#routineDate').textContent='업무를 등록하고 완료 여부를 체크하세요 · 달력과 별도 관리';

  const active=all.filter(r=>!r.taskDone),completed=all.filter(r=>!!r.taskDone);
  const badge=$('#routineBadge');badge.textContent=active.length;badge.hidden=!active.length;
  const items=all.filter(r=>routineFilter==='전체'||r.cat===routineFilter);
  const open=items.filter(r=>!r.taskDone).sort((a,b)=>(a.due||'9999-12-31').localeCompare(b.due||'9999-12-31')||(a.createdAt||0)-(b.createdAt||0));
  const done=items.filter(r=>!!r.taskDone).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  $('#rLateNum').textContent=items.length;$('#rLateNum').classList.remove('late');
  $('#rOpenNum').textContent=open.length;$('#rDoneNum').textContent=done.length;
  $('#rProgress').style.width=(items.length?Math.round(done.length/items.length*100):0)+'%';
  $('#rProgressText').textContent=items.length?`${done.length}/${items.length} 완료`:'등록된 업무 없음';
  box.innerHTML='';
  if(!user){box.innerHTML='<div class="empty" style="margin-top:16px">Google 로그인 후 업무 리스트가 표시됩니다.</div>';return}
  if(!routines.length){box.innerHTML='<div class="empty" style="margin-top:16px">아직 등록된 업무가 없어요.<br>+ 업무 추가 버튼으로 첫 업무를 등록해 보세요.</div>';return}
  if(!items.length){box.innerHTML='<div class="empty" style="margin-top:16px">이 카테고리에 등록된 업무가 없습니다.</div>';return}
  const section=(title,cls,list)=>{
    if(!list.length)return;
    const sec=document.createElement('div');sec.className='rSection';
    sec.innerHTML=`<div class="rSectionTitle ${cls}">${title} <span class="cnt">${list.length}</span></div>`;
    const ul=document.createElement('div');ul.className='rList';list.forEach(r=>ul.appendChild(routineRow(r)));
    sec.appendChild(ul);box.appendChild(sec);
  };
  section('진행 중','',open);section('완료','doneT',done);
}
function openRoutine(id=null){
  if(!requireLogin())return;
  routineEditing=id;
  const r=id?routines.find(x=>x.id===id):{};
  if(!r)return;
  $('#routineModalTitle').textContent=id?'업무 수정':'업무 추가';
  $('#rTitle').value=r.title||'';
  $('#rCat').value=r.cat||'NCMN';
  $('#rDue').value=r.due||'';
  $('#rStatus').value=r.taskDone?'done':'open';
  $('#rMemo').value=r.memo||'';
  $('#rDelete').style.display=id?'':'none';
  $('#routineBackdrop').classList.add('show');
  setTimeout(()=>$('#rTitle').focus(),50);
}
function closeRoutine(){$('#routineBackdrop').classList.remove('show');routineEditing=null}

/* ===================== 동기화 / 로그인 ===================== */
function startSync(){
  if(unsub)unsub(); if(memoUnsub)memoUnsub(); if(routineUnsub)routineUnsub();
  setSync('동기화 중...');
  unsub=onSnapshot(userCol(),snap=>{events=snap.docs.map(d=>({id:d.id,...d.data()}));setSync('동기화됨','ok');renderCalendar()},err=>{console.error(err);setSync('동기화 오류','err')});
  memoUnsub=onSnapshot(memoCol(),snap=>{memos=snap.docs.map(d=>({id:d.id,...d.data()}));renderCalendar()},err=>console.error(err));
  routineUnsub=onSnapshot(routineCol(),snap=>{routines=snap.docs.map(d=>({id:d.id,...d.data()}));renderRoutines()},err=>{console.error(err);setSync('업무 리스트 동기화 오류','err')});
}
$('#loginBtn').onclick=async()=>{
  try{ await setPersistence(auth,browserLocalPersistence); await signInWithPopup(auth,provider); }
  catch(e){
    console.error(e);
    alert(e.code==='auth/unauthorized-domain'
      ?'Firebase 승인된 도메인에 현재 사이트 주소(GitHub Pages)를 추가해주세요.'
      :'Google 로그인에 실패했습니다. Safari에서 한 번 로그인한 뒤 홈화면 앱을 다시 열어보세요.');
  }
};
$('#logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  user=u;
  if(u){$('#loginBtn').style.display='none';$('#logoutBtn').style.display='';$('#authUser').textContent=u.email||'';startSync()}
  else{
    if(unsub)unsub(); if(memoUnsub)memoUnsub(); if(routineUnsub)routineUnsub(); unsub=memoUnsub=routineUnsub=null;
    events=[];memos=[];routines=[];
    $('#loginBtn').style.display='';$('#logoutBtn').style.display='none';$('#authUser').textContent='';setSync('로그인 필요');
    renderCalendar();renderRoutines();
  }
});

/* ===================== 이벤트 연결 ===================== */
$('#prevBtn').onclick=()=>{current.setMonth(current.getMonth()-1);renderCalendar()};
$('#nextBtn').onclick=()=>{current.setMonth(current.getMonth()+1);renderCalendar()};
$('#todayBtn').onclick=()=>{const n=new Date();current=new Date(n.getFullYear(),n.getMonth(),1);renderCalendar()};
$('#newBtn').onclick=()=>openModal();
$('#quickAdd').onclick=()=>openModal(ymd(new Date()));
$('#search').oninput=renderCalendar;
$('#taskSearch').oninput=renderTasks;
$('#sideCat').onchange=e=>{sideFilter=e.target.value;renderTasks()};
$('#taskTabs').onclick=e=>{
  const b=e.target.closest('.segBtn'); if(!b)return;
  document.querySelectorAll('#taskTabs .segBtn').forEach(x=>x.classList.toggle('active',x===b));
  taskTab=b.dataset.tab; renderTasks();
};
$('#catFilters').onclick=e=>{
  const b=e.target.closest('.catBtn'); if(!b)return;
  const c=b.dataset.cat; catSet.has(c)?catSet.delete(c):catSet.add(c); renderCalendar();
};
$('#catAllBtn').onclick=()=>{catSet=catSet.size===CATS.length?new Set():new Set(CATS);renderCalendar()};
$('#mobileAgendaAdd').onclick=()=>openModal(ymd(new Date()));
$('#mobileAgendaFilters').onclick=e=>{
  const b=e.target.closest('.agendaFilter'); if(!b)return;
  document.querySelectorAll('.agendaFilter').forEach(x=>x.classList.toggle('active',x===b));
  agendaFilter=b.dataset.agenda; renderMobileAgenda();
};

$('#closeModal').onclick=$('#cancelBtn').onclick=closeModal;
$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};
$('#saveBtn').onclick=async()=>{
  const title=$('#titleInput').value.trim(), start=$('#startInput').value, end=$('#endInput').value||start;
  if(!title||!start){alert('일정명과 시작일을 입력해주세요.');return}
  if(end<start){alert('종료일은 시작일보다 빠를 수 없습니다.');return}
  const old=editing?events.find(x=>x.id===editing):null;
  await saveEvent({...(old||{}),id:editing||'e'+Date.now(),title,start,end,cat:$('#catInput').value,duration:$('#durInput').value,done:$('#doneInput').value==='true',memo:$('#memoInput').value.trim()});
  closeModal();
};
$('#deleteBtn').onclick=async()=>{if(editing&&confirm('이 일정을 삭제할까요?')){const id=editing;closeModal();await removeEvent(id)}};

$('#memoClose').onclick=$('#memoCancel').onclick=closeMemo;
$('#memoBackdrop').onclick=e=>{if(e.target.id==='memoBackdrop')closeMemo()};
$('#memoSave').onclick=async()=>{
  const text=$('#memoTextInput').value.trim();
  if(!text){alert('메모 내용을 입력해주세요.');return}
  await saveMemo({id:memoEditing||'m'+Date.now(),date:memoDate,text,done:$('#memoDoneInput').value==='true',
    createdAt:memoEditing?(memos.find(x=>x.id===memoEditing)?.createdAt||Date.now()):Date.now()});
  closeMemo();
};
$('#memoDeleteBtn').onclick=async()=>{if(memoEditing&&confirm('이 메모를 삭제할까요?')){const id=memoEditing;closeMemo();await removeMemo(id)}};

$('#routineAdd').onclick=()=>openRoutine();
$('#rClose').onclick=$('#rCancel').onclick=closeRoutine;
$('#routineBackdrop').onclick=e=>{if(e.target.id==='routineBackdrop')closeRoutine()};
$('#rSave').onclick=async()=>{
  const title=$('#rTitle').value.trim();
  if(!title){alert('업무명을 입력해주세요.');return}
  const old=routineEditing?routines.find(x=>x.id===routineEditing):null;
  const taskDone=$('#rStatus').value==='done';
  const saved=await saveRoutine({...(old||{}),id:routineEditing||'r'+Date.now(),title,cat:$('#rCat').value,
    due:$('#rDue').value,memo:$('#rMemo').value.trim(),taskDone,
    completedAt:taskDone?(old?.completedAt||ymd(new Date())):null,createdAt:old?.createdAt||Date.now()});
  if(saved)closeRoutine();
};
$('#rDelete').onclick=async()=>{if(routineEditing&&confirm('이 업무를 삭제할까요?')){const id=routineEditing;if(await removeRoutine(id))closeRoutine()}};
$('#routineFilters').onclick=e=>{
  const b=e.target.closest('.rPill'); if(!b)return;
  document.querySelectorAll('.rPill').forEach(x=>x.classList.toggle('active',x===b));
  routineFilter=b.dataset.r; renderRoutines();
};

function setView(v){
  document.body.classList.toggle('view-routine',v==='routine');
  document.querySelectorAll('.viewTab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  try{localStorage.setItem('hView',v)}catch(_){}
  renderRoutines(); window.scrollTo(0,0);
}
$('#viewTabs').onclick=e=>{const b=e.target.closest('.viewTab'); if(b)setView(b.dataset.view)};
try{ if(localStorage.getItem('hView')==='routine')setView('routine'); }catch(_){}

$('#backupBtn').onclick=()=>{
  if(!requireLogin())return;
  const blob=new Blob([JSON.stringify({events,memos,routines},null,2)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`hjm-dashboard-backup-${ymd(new Date())}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$('#restoreInput').onchange=async e=>{
  if(!requireLogin()){e.target.value='';return}
  const f=e.target.files[0]; if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    const ev=Array.isArray(data)?data:(data.events||[]), mm=Array.isArray(data)?[]:(data.memos||[]), rr=Array.isArray(data)?[]:(data.routines||[]);
    const b=writeBatch(db);
    ev.forEach(x=>{const id=x.id||'e'+Date.now()+Math.random();b.set(doc(db,'users',user.uid,'hjm_events',id),{...x,id})});
    mm.forEach(x=>{const id=x.id||'m'+Date.now()+Math.random();b.set(doc(db,'users',user.uid,'hjm_memos',id),{...x,id})});
    rr.forEach(x=>{const id=x.id||'r'+Date.now()+Math.random();b.set(doc(db,'users',user.uid,'hjm_routines',id),{...x,id})});
    await b.commit(); alert('복원했습니다.');
  }catch{alert('올바른 백업 파일이 아닙니다.')}
  e.target.value='';
};

// 자정이 지나면 화면 갱신
let lastDay=ymd(new Date());
const dayCheck=()=>{const d=ymd(new Date()); if(d!==lastDay){lastDay=d;renderCalendar();renderRoutines()}};
setInterval(dayCheck,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});

renderCalendar();
renderRoutines();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(console.error); });
}
