name: 아침 8시 일정 푸시

on:
  schedule:
    # 매일 07:40 KST(= UTC 22:40)에 시작해서 스크립트가 08:00 정각까지 기다렸다가 보냅니다.
    - cron: '40 22 * * *'
  workflow_dispatch:
    inputs:
      now:
        description: '기다리지 않고 바로 보내기 (테스트용)'
        type: boolean
        default: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node morning-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          SKIP_WAIT: ${{ github.event_name == 'workflow_dispatch' && inputs.now }}
