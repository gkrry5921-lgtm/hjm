name: 아침 8시 일정 푸시

on:
  schedule:
    # GitHub 예약 실행은 가끔 늦거나 빠지는 날이 있어서 세 번 예약해 둡니다.
    # 먼저 성공한 한 번만 보내고 나머지는 '이미 보냈음'으로 건너뜁니다.
    - cron: '40 22 * * *'   # 07:40 KST
    - cron: '5 23 * * *'   # 08:05 KST
    - cron: '30 23 * * *'   # 08:30 KST
  workflow_dispatch:
    inputs:
      now:
        description: '기다리지 않고 바로 보내기 (테스트용)'
        type: boolean
        default: true

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node morning-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          SKIP_WAIT: ${{ github.event_name == 'workflow_dispatch' && inputs.now }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          ONLY: push
